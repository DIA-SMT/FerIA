# Mantiene despierto el proyecto de Supabase y avisa si el sitio se cae.
#
# El plan gratuito de Supabase pausa los proyectos que pasan una semana sin
# actividad. Ya nos pasó: el 24/8 quedó todo funcionando y el 8/9 el proyecto
# había desaparecido del pooler («FATAL: (ENOTFOUND) tenant/user ... not
# found»), con el sitio sirviendo sólo el cascarón de carga.
#
# Por qué una consulta SQL de verdad y no un ping HTTP a la API REST: con RLS
# sin políticas, una lectura anónima vuelve vacía y no hay certeza de que eso
# cuente como actividad. Una consulta al Postgres cuenta seguro, y de paso
# comprueba que la base tenga datos.
#
# Los chequeos del sitio van contra `/api/salud`, no contra el HTML. Antes se
# buscaba el literal «Ferias activas» en la portada, pero ese texto es la
# etiqueta fija del contador del hero: aparece igual con el sitio vacío, así
# que el monitor daba verde con «Por ahora no hay ferias programadas», y
# cualquiera que reescribiera la etiqueta lo rompía sin enterarse. El endpoint
# devuelve números y un estado, y responde 503 por su cuenta cuando no hay
# ninguna edición vigente o cuando la base no contesta.
#
# ⚠️ DOS COSAS QUE HAY QUE SABER:
#
# 1. Los workflows programados corren SÓLO desde la rama por defecto. Este
#    archivo tiene que estar en `main` para que el cron dispare.
# 2. GitHub deshabilita los workflows programados en repos sin actividad
#    durante 60 días, y manda un mail antes. Justo la inactividad de la que nos
#    queremos proteger puede apagar la protección: si llega ese aviso, hay que
#    reactivarlo desde la pestaña Actions.

name: Mantener la base despierta

on:
  schedule:
    # 09:17 UTC = 06:17 en Tucumán. Minuto salteado a propósito: en punto es
    # cuando GitHub tiene más cola y más demora los programados.
    - cron: "17 9 * * *"
  # Para poder probarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# No necesita tocar el repo.
permissions: {}

# Que dos corridas no se pisen si una queda colgada.
concurrency:
  group: mantener-base-despierta
  cancel-in-progress: false

env:
  # La URL de producción, en un solo lugar: si mañana el sitio pasa a un
  # dominio municipal, se cambia acá y no en cada `curl`.
  SITIO: https://fer-ia.vercel.app

jobs:
  despertar:
    runs-on: ubuntu-latest
    # 10 y no 5: el job instala postgresql-client en frio (~60 s) y ahora hace
    # seis peticiones HTTP de hasta 45 s cada una. Con 5 el peor caso realista
    # se pasaba, y un timeout del runner se lee igual que un sitio caido.
    timeout-minutes: 10

    steps:
      - name: Consultar la base
        env:
          # Secreto del repo. Sirve DATABASE_URL o DIRECT_URL del .env.
          URL_BASE: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${URL_BASE}" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL en el repositorio."
            exit 1
          fi

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          # `?pgbouncer=true` y compañía son parámetros de Prisma: libpq los
          # rechaza como palabras clave desconocidas, así que hay que recortar
          # la query.
          #
          # Se corta a partir del `@`, no del principio: una contraseña de
          # Supabase puede contener un `?`, y recortando desde el primer signo
          # de pregunta la URL quedaba partida al medio
          # («postgresql://postgres.abc:cla»). Está probado con una contraseña
          # con `?` adentro.
          if [ "${URL_BASE}" = "${URL_BASE#*@}" ]; then
            echo "::error::SUPABASE_DB_URL no parece una URL de Postgres (no tiene @)."
            exit 1
          fi

          credenciales="${URL_BASE%@*}"
          servidor="${URL_BASE##*@}"
          limpia="${credenciales}@${servidor%%\?*}"

          ferias=$(psql "${limpia}" -tAc 'select count(*) from ferias')
          echo "Ferias en la base: ${ferias}"

          if [ "${ferias}" -eq 0 ]; then
            echo "::error::La base responde pero no tiene ferias. ¿Falta correr el seed?"
            exit 1
          fi

      - name: Revisar que el sitio tenga algo para mostrar
        run: |
          set -euo pipefail

          # El parámetro con la fecha evita que Vercel devuelva una respuesta
          # cacheada: hace falta que la petición llegue a renderizar de nuevo.
          url="${SITIO}/api/salud?keepalive=$(date +%s)"

          # Sin `--fail`: el 503 del endpoint es información, no un error de
          # transporte, y queremos leer el cuerpo para saber cuál de los dos
          # casos es. El código viaja pegado al final con `-w`.
          if ! respuesta=$(curl -sS --max-time 45 -w $'\n%{http_code}' "${url}"); then
            echo "::error::No se pudo consultar ${SITIO}/api/salud."
            exit 1
          fi

          codigo=$(printf '%s' "${respuesta}" | tail -n1)
          cuerpo=$(printf '%s' "${respuesta}" | sed '$d')
          echo "HTTP ${codigo} — ${cuerpo}"

          if [ "${codigo}" != "200" ]; then
            echo "::error::/api/salud respondió ${codigo}: el sitio está sin ediciones vigentes o sin base."
            exit 1
          fi

          # Se comprueba también el JSON porque un 200 no alcanza como señal:
          # una página de error de la plataforma, o un redirect a un login,
          # también devuelven 200 con otro cuerpo. Y `edicionesVigentes` es el
          # dato que el chequeo viejo —un grep de la etiqueta del hero— no
          # llegaba a mirar nunca.
          if ! printf '%s' "${cuerpo}" |
            jq -e '.estado == "ok" and .edicionesVigentes > 0' >/dev/null; then
            echo "::error::/api/salud devolvió 200 pero el contenido no es el esperado."
            exit 1
          fi

          echo "El sitio tiene ferias y ediciones vigentes para mostrar."

      - name: Revisar los códigos de respuesta de las páginas
        run: |
          set -euo pipefail

          sello=$(date +%s)
          fallo=0

          comprobar() {
            ruta="$1"
            esperado="$2"

            if ! codigo=$(curl -sS -o /dev/null --max-time 45 \
              -w '%{http_code}' "${SITIO}${ruta}?keepalive=${sello}"); then
              echo "::error::No se pudo consultar ${ruta}."
              fallo=1
              return
            fi

            if [ "${codigo}" = "${esperado}" ]; then
              echo "OK  ${ruta} → ${codigo}"
            else
              echo "::error::${ruta} devolvió ${codigo} y se esperaba ${esperado}."
              fallo=1
            fi
          }

          comprobar "/" 200
          comprobar "/ferias" 200
          comprobar "/stands" 200

          # Un slug inexistente tiene que dar 404 de verdad, no 200 con la
          # pantalla de «no encontramos esta página»: hasta el 23/10 respondía
          # 200 porque el `loading.tsx` de `(public)` empezaba a streamear la
          # respuesta antes de que corriera `notFound()`, y una vez enviado el
          # status ya no se puede cambiar. Google indexa esas URLs muertas como
          # páginas válidas, así que el chequeo queda acá para que no vuelva a
          # pasar sin que nadie lo note.
          comprobar "/stands/no-existe" 404
          comprobar "/ferias/no-existe" 404

          exit "${fallo}"
